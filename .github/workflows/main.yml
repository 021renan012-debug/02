name: Windows Cloud PC - AnyDesk (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360 # Limite máximo real do GitHub Actions para runners gratuitos

    steps:
      - name: Downloading & Installing Essentials
        run: |
          # Baixa o arquivo .bat para instalar componentes essenciais
          Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/dr310yfyg0ti6mwano3fv/Downloads.bat?rlkey=a2wbeiel73ra5i0nsdd6ud9qr&st=r26jd007&dl=1" -OutFile "Downloads.bat"
          # Executa o script .bat para instalar os componentes
          cmd /c Downloads.bat

      - name: Log In To AnyDesk
        run: |
          # Verifica se o arquivo start.bat existe antes de executar
          if (Test-Path "start.bat") {
              cmd /c start.bat
          } else {
              Write-Host "Arquivo start.bat não encontrado. Verifique a configuração."
          }

      - name: Monitor AnyDesk and Keep Alive
        run: |
          # Monitora a conexão e mantém a máquina viva no mesmo step
          $timeout = New-TimeSpan -Minutes 350 # Mantém rodando até perto do limite do GitHub
          $sw = [diagnostics.stopwatch]::StartNew()
          
          while ($sw.Elapsed -lt $timeout) {
              $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              if (-not $process) {
                  Write-Host "AnyDesk não está rodando, reiniciando..."
                  if (Test-Path "start.bat") { cmd /c start.bat }
              }
              Start-Sleep -Seconds 60 # Verifica a cada 1 minuto e mantém o runner ativo
          }

      - name: Clean Up Temporary Files
        if: always() # Executa a limpeza mesmo se o tempo acabar ou houver falha
        run: |
          if (Test-Path "Downloads.bat") { Remove-Item Downloads.bat -Force }
          Write-Host "Limpeza completa."
